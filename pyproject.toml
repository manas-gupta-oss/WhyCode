[project]
name = "whycode"
version = "0.1.0"
description = "Answers \"why is the code like this?\" for a real codebase, with evidence on every answer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "groq>=0.11",
    "httpx>=0.27",
    "neo4j>=5.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whycode"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is unit only. `-m integration` / `-m live` on the command line overrides this.
addopts = "-m unit --strict-markers"
markers = [
    "unit: no network, no databases; LLM and GitHub mocked with saved fixtures",
    "integration: real local Postgres and local Neo4j container (docker compose up)",
    "live: real GitHub and LLM calls; costs API calls, opt-in only, never in CI",
]
