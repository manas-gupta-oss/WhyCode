# Local services only. Credentials here are dev-only and never used for real data.
# Real graph data lives in Neo4j Aura; the neo4j service below is for integration tests.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whycode
      POSTGRES_PASSWORD: whycode_dev_only
      POSTGRES_DB: whycode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whycode -d whycode"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j-test:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/whycode_dev_only
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p whycode_dev_only 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
